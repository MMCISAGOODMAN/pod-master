# 订单服务 — order 业务域
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: podmaster-demo
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: podmaster-demo
    business-domain: order
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: podmaster-demo
        business-domain: order
        tier: backend
    spec:
      containers:
        - name: order
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              echo "[INFO] OrderService started"
              echo "[WARN] slow query detected on orders table"
              while true; do sleep 3600; done
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: podmaster-demo
  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: podmaster-demo
    business-domain: order
  annotations:
    podmaster.io/topology-edges: "mysql-db,redis-cache"
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
